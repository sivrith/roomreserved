<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · RoomReserved</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><a class="brand" href="/"><span class="brand-mark">R</span>RoomReserved<span>.</span></a><form class="auth-card" method="post" th:action="@{/register}"><p class="eyebrow">A PLACE FOR YOUR PLANS</p><h1>Make yourself at home.</h1><p>Create your account to reserve a room and manage your upcoming stays.</p><p class="error" th:if="${error}" th:text="${error}"></p><label>Full name<input name="fullName" placeholder="Your full name" required autocomplete="name"></label><label>Email address<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password"></label><button class="button full">Create account <span>↗</span></button><p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p><p class="auth-foot"><a href="/">← Return to discover stays</a></p></form></body></html>
