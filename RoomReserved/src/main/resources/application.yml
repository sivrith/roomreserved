server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomreserved}
    username: ${DB_USERNAME:roomreserved}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

roomreserved:
  pricing:
    tax-percent: ${TAX_PERCENT:0}
    service-fee-percent: ${SERVICE_FEE_PERCENT:0}
  booking-holds:
    minutes: ${BOOKING_HOLD_MINUTES:15}
  paymongo:
    api-base-url: ${PAYMONGO_API_BASE_URL:https://api.paymongo.com}
    secret-key: ${PAYMONGO_SECRET_KEY:}
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:}
    live-mode: ${PAYMONGO_LIVE_MODE:false}
    payment-method-types: ${PAYMONGO_PAYMENT_METHOD_TYPES:qrph}
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
