<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RoomReserved</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><a class="brand" href="/"><span class="brand-mark">R</span>RoomReserved<span>.</span></a><form class="auth-card" method="post" th:action="@{/login}"><p class="eyebrow">WELCOME BACK</p><h1>Your next stay awaits.</h1><p>Sign in to view your reservations and keep your plans together.</p><p class="error" th:if="${param.error}">The email or password doesn't match our records.</p><p class="success" th:if="${param.registered}">Your account is ready. Please sign in.</p><label>Email address<input name="username" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><button class="button full">Sign in <span>↗</span></button><p class="auth-foot">New to RoomReserved? <a href="/register">Create an account</a></p><p class="auth-foot"><a href="/">← Return to discover stays</a></p></form></body></html>
